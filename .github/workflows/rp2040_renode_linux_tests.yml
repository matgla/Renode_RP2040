name: Renode RP2040 Linux - Tests

on:
  workflow_call:

jobs:
  build_pico_examples:
    name: "Renode Linux"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install Ubuntu dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            ninja-build \
            python3-pip \
            wget
      - name: Create GIT Identity
        shell: bash
        run: |
          git config --global user.email "you@example.com" && git config --global user.name "Your Name"
      - uses: actions/download-artifact@v4
        with:
          name: pico-examples
          path: tests/pico-examples/build
      - name: Download Renode
        shell: bash
        run: |
          wget https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable.tar.gz
          mkdir -p renode
          tar -xzf renode-1.16.1.linux-portable.tar.gz -C renode --strip-components=1
      - name: Install Renode Test Requirements
        shell: bash
        run: |
          pip3 install -r tests/requirements.txt
      - name: Build & Execute Tests
        shell: bash
        run: |
          export PATH=$PATH:$PWD/renode:$PWD/renode/tests
          # Set PYTHONPATH so Renode can find installed Python packages
          export PYTHONPATH=$(python3 -c "import site; print(site.getsitepackages()[0])")
          python3 ./tests/run_tests.py -r 3 -f tests/tests.yaml -j 0
      - uses: actions/upload-artifact@v4
        with:
          name: run_artifacts
          if: always()
          compression-level: 9
          path: |
            logs/*
            snapshots/*


